name: Verify storefront
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: storefront-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-browser-checks
          path: |
            test-results/
            playwright-report/
          retention-days: 7
